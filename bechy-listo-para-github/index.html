<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bechy, no sabes cuántas ganas tengo de besarte.">
  <meta name="theme-color" content="#86cdee">
  <title>Bechy</title>
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/minions.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#mensaje">Saltar al mensaje</a>
  <div class="sky" aria-hidden="true"></div>
  <div class="effects" aria-hidden="true"></div>
  <div class="topbar"><button class="motion-toggle" id="motionToggle" type="button" hidden aria-pressed="false">Pausar animaciones</button></div>
  <main id="inicio">
    <div class="opening">
      <section class="message-card" id="mensaje" aria-labelledby="love-title">
      <h1 id="love-title">Bechy</h1>
      <button class="button" id="loveButton" type="button" hidden aria-controls="secretMessage" aria-expanded="false">Ábreme</button>
      <div class="secret-message" id="secretMessage">
        <h2 id="confession-title" tabindex="-1">No sabes cuántas ganas tengo de <em>besarte</em></h2>
      </div>
    </section>
      <div class="background-scene" aria-hidden="true">
        <div class="background-art">
          <div class="banana"></div>
          <div class="minion">
            <div class="hair"><div class="hair1"></div><div class="hair2"></div></div>
            <div class="body"><div class="monocle"><div class="eye"></div></div></div>
          </div>
        </div>
      </div>
    </div>
      <div class="cast" role="group" aria-label="Bill, Jerry y Evil te acompañan">
          <div class="character">
            <div class="character-slot" role="img" aria-label="Bill, dibujado con HTML y CSS">
              <div class="character-art" aria-hidden="true">          <div class="bill">
            <div class="lights">
              <span class="white_light"></span>
              <span class="dark_light"></span>
            </div>
            <div class="hair">
              <span class="hair1"></span>
              <span class="hair1 make_it_left_hair1"></span>
              <span class="hair2"></span>
            </div>
            <div class="eyes">
              <div class="eye_animate"></div>
              <div class="glasses"></div>
              <div class="white_part">
                <div class="brown_eye"><span class="black_part"></span></div>
              </div>
            </div>
            <div class="black_tie">
              <span class="right_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
              <span class="left_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
            </div>
            <div class="smile"></div>
            <div class="arm"></div>
            <div class="hand"><span class="hand_parts"></span></div>
            <div class="arm make_it_right_arm"></div>
            <div class="hand make_it_right_hand"><span class="hand_parts"></span></div>
            <div class="curves">
              <span class="curve1"></span>
              <span class="curve1 make_it_left_curve"></span>
              <span class="curve2"></span>
            </div>
            <div class="clothes">
              <div class="main"></div>
              <div class="blue_borders"></div>
              <div class="right_shirt"></div>
              <div class="right_shirt make_it_left"></div>
              <div class="bottom"></div>
            </div>
            <div class="pocket">
              <div class="logo"></div>
              <span class="lines"></span>
            </div>
            <div class="legs">
              <div class="right_leg"></div>
              <div class="right_leg make_it_left_leg"></div>
              <div class="shoes"><span class="small_shoes"></span></div>
              <div class="shoes make_it_left_shoes"><span class="small_shoes"></span></div>
            </div>
          </div></div>
            </div>
            </div>
          <div class="character">
            <div class="character-slot" role="img" aria-label="Jerry, dibujado con HTML y CSS, saludando con la mano">
              <div class="character-art" aria-hidden="true">          <div class="jerry">
            <div class="lights">
              <span class="white_light"></span>
              <span class="dark_light"></span>
            </div>
            <div class="jerry_hair">
              <ul>
                <li class="h1"></li><li class="h2"></li><li class="h3"></li><li class="h4"></li>
                <li class="h5"></li><li class="h6"></li><li class="h7"></li><li class="h8"></li>
                <li class="h9"></li><li class="h10"></li><li class="h11"></li><li class="h12"></li>
              </ul>
            </div>
            <div class="eyes1">
              <div class="eye_animate"></div>
              <div class="glasses"></div>
              <div class="white_part"><div class="brown_eye"><span class="black_part"></span></div></div>
            </div>
            <div class="eyes2">
              <div class="eye_animate"></div>
              <div class="glasses"></div>
              <div class="white_part"><div class="brown_eye"><span class="black_part"></span></div></div>
            </div>
            <div class="jerry_hand">
              <div class="jerry_lh"></div>
              <div class="animated_lh"><span class="gloves_lh"></span><span class="gloves_lh2"></span></div>
              <div class="jerry_rh"></div>
              <span class="gloves_rh"></span>
            </div>
            <div class="black_tie">
              <span class="right_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
              <span class="left_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
            </div>
            <div class="jerry_smile"><span class="teeth1"></span><span class="teeth2"></span></div>
            <div class="curves">
              <span class="jerry_curve1"></span>
              <span class="jerry_curve1 jerry_left_curve"></span>
              <span class="jerry_curve2"></span>
            </div>
            <div class="clothes">
              <div class="main_jerry"></div>
              <div class="right_shirt jerry_right_shirt"></div>
              <div class="right_shirt jerry_left_shirt"></div>
              <div class="jerry_bottom"></div>
            </div>
            <div class="pocket"><div class="logo"></div><span class="lines"></span></div>
            <div class="legs">
              <div class="jerry_shoes"><span class="jerry_small_shoes"></span></div>
              <div class="jerry_shoes jerry_left_shoes"><span class="jerry_small_shoes"></span></div>
            </div>
          </div></div>
            </div>
            </div>
          <div class="character">
            <div class="character-slot" role="img" aria-label="Evil, dibujado con HTML y CSS">
              <div class="character-art" aria-hidden="true">          <div class="evil">
            <ul class="evil_hair">
              <li class="eh1"></li><li class="eh2"></li><li class="eh3"></li><li class="eh4"></li><li class="eh5"></li>
            </ul>
            <div class="eyes">
              <div class="eye_animate"></div>
              <div class="glasses"></div>
              <div class="white_part"><div class="brown_eye"><span class="black_part"></span></div></div>
            </div>
            <div class="black_tie">
              <span class="right_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
              <span class="left_tie"><span class="top_tie"></span><span class="down_tie"></span></span>
            </div>
            <div class="evil_mouth"><span class="evil_teeth"></span><span class="evil_teeth1"></span></div>
            <div class="clothes">
              <div class="right_shirt evil_right_shirt"></div>
              <div class="right_shirt evil_left_shirt"></div>
              <div class="evil_bottom"></div>
              <div class="evil_logo"><p>M</p></div>
            </div>
            <div class="legs">
              <div class="evil_right_leg"></div>
              <div class="evil_right_leg evil_left_leg"></div>
              <div class="shoes evil_right_shoes"><span class="small_shoes"></span></div>
              <div class="shoes evil_left_shoes"><span class="small_shoes"></span></div>
            </div>
            <div class="evil_hand">
              <div class="evil_rh"><span class="evil_gloves_rh"></span></div>
              <div class="evil_lh"><span class="evil_gloves_lh"></span></div>
            </div>
          </div></div>
            </div>
            </div>
      </div>
  </main>
  <footer class="footer"><small>Personajes HTML/CSS basados en el trabajo atribuido a <a href="https://www.amrzek.com" target="_blank" rel="noopener noreferrer">Amr Zakaria<span class="sr-only"> (abre en otra pestaña)</span></a>.</small></footer>
</body>
</html>
